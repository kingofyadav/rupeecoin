[[bin]]
name = "rupeecoin-node"
path = "src/main.rs"

[dependencies]
rupeecoin-crypto     = { path = "../core/crypto" }
rupeecoin-types      = { path = "../core/types" }
rupeecoin-blockchain = { path = "../core/blockchain" }
