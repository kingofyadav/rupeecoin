name: rupeecoin_wallet
description: RupeeCoin mobile wallet — post-quantum, privacy-native.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Rust bridge ────────────────────────────────────────────────────────────
  flutter_rust_bridge: ^2.0.0

  # ── HTTP & storage ─────────────────────────────────────────────────────────
  http: ^1.2.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.0.0   # keystore path never in plain prefs

  # ── UI ────────────────────────────────────────────────────────────────────
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0               # Receive QR code

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  ffigen: ^11.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
